name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    # Нативная компиляция и LTO заметно тяжелее обычной упаковки.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: MedMask-Windows-x64
            bundle: dist/MedMask
            application: dist/MedMask/MedMask.exe
            path: dist/MedMask-Windows-x64.zip
          - name: macOS
            os: macos-14
            artifact: MedMask-macOS
            bundle: dist/MedMask.app
            application: dist/MedMask.app/Contents/MacOS/MedMaskCore
            path: dist/MedMask-macOS.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check closed-source distribution license
        if: startsWith(github.ref, 'refs/tags/') && vars.PYMUPDF_COMMERCIAL_LICENSE_CONFIRMED != 'true'
        shell: bash
        run: |
          echo "Protected releases contain PyMuPDF and require an Artifex commercial license." >&2
          echo "Set repository variable PYMUPDF_COMMERCIAL_LICENSE_CONFIRMED=true after obtaining it." >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -c constraints.txt ".[build]"

      - name: Test
        run: python scripts/test_all.py

      - name: Build
        run: python scripts/build_native.py

      - name: Sign macOS bundle
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/MedMask.app/Contents/MacOS/MedMaskCore
          codesign --force --sign - dist/MedMask.app

      - name: Verify protected build
        run: python scripts/verify_protected_build.py "${{ matrix.bundle }}" "${{ matrix.application }}"

      # Проверяем именно собранный артефакт: так видно, попали ли в сборку
      # модели OCR и шрифт и работает ли приложение без Python.
      - name: Smoke test
        run: python scripts/smoke_test.py "${{ matrix.application }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\MedMask -DestinationPath dist\MedMask-Windows-x64.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MedMask.app dist/MedMask-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        run: |
          version="$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('medmask/__init__.py').read_text()).group(1))")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией пакета $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: MedMask-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MedMask $GITHUB_REF_NAME" \
            --notes "Автономный локальный инструмент с офлайн-OCR для PDF-сканов и изображений. Python и интернет не требуются. Исходные документы не изменяются. Windows: распакуйте архив и запустите MedMask.exe. macOS: распакуйте и перенесите MedMask.app в «Программы»."
