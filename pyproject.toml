[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medmask"
dynamic = ["version"]
description = "Локальное обезличивание медицинских документов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chardet>=5.2,<6",
  "docx2txt>=0.9,<1",
  "openpyxl>=3.1,<4",
  "onnxruntime>=1.28,<2",
  "PySide6>=6.8,<7",
  "PyMuPDF>=1.25,<2",
  "rapidocr==3.9.2",
  "striprtf>=0.0.29,<1",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.12,<7",
  "pytest>=9.0.3,<10",
  "ruff>=0.16.4,<0.17",
]

[project.scripts]
medmask = "medmask.launcher:main"

[tool.setuptools]
packages = ["medmask", "medmask.gui"]

[tool.setuptools.dynamic]
version = { attr = "medmask.__version__" }

[tool.setuptools.package-data]
medmask = [
  "assets/*.onnx",
  "assets/*.ttf",
  "assets/app_glyph.png",
  "assets/app_icon.png",
  "gui/qml/*.qml",
  "gui/qml/MedMask/*.qml",
  "gui/qml/MedMask/qmldir",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
