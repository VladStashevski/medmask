name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: MedMask-Windows-x64
            path: dist/MedMask-Windows-x64.exe
          - name: macOS
            os: macos-14
            artifact: MedMask-macOS
            path: dist/MedMask-macOS.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install ".[build]"

      - name: Test
        run: python -m pytest

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MedMask main.py
          Move-Item dist\MedMask.exe dist\MedMask-Windows-x64.exe

      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          MEDMASK_VERSION: ${{ github.ref_name }}
        run: |
          pyinstaller --noconfirm --clean --windowed --name MedMask --osx-bundle-identifier ru.medmask.local main.py
          version="${MEDMASK_VERSION#v}"
          plutil -replace CFBundleShortVersionString -string "$version" dist/MedMask.app/Contents/Info.plist
          codesign --force --deep --sign - dist/MedMask.app
          ditto -c -k --sequesterRsrc --keepParent dist/MedMask.app dist/MedMask-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MedMask-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MedMask $GITHUB_REF_NAME" \
            --notes "Автономный локальный инструмент. Python устанавливать не нужно. Документы никуда не отправляются. OCR для сканов и изображений пока не поддерживается."
