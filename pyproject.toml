[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medmask"
dynamic = ["version"]
description = "Локальное обезличивание медицинских документов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chardet>=5.2,<6",
  "docx2txt>=0.9,<1",
  "openpyxl>=3.1,<4",
  "onnxruntime>=1.28,<2",
  "PySide6>=6.8,<7",
  "PyMuPDF>=1.25,<2",
  "rapidocr==3.9.2",
  "striprtf>=0.0.29,<1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<9",
]

[project.scripts]
medmask = "medmask.launcher:main"

[tool.setuptools]
packages = ["medmask", "medmask.gui"]

[tool.setuptools.dynamic]
version = { attr = "medmask.__version__" }

[tool.setuptools.package-data]
medmask = [
  "assets/*.onnx",
  "assets/*.ttf",
  "assets/app_glyph.png",
  "assets/app_icon.png",
  "gui/qml/*.qml",
  "gui/qml/MedMask/*.qml",
  "gui/qml/MedMask/qmldir",
]
