name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: MedMask-Windows-x64
            path: dist/MedMask.exe
          - name: macOS Apple Silicon
            os: macos-14
            artifact: MedMask-macOS-Apple-Silicon
            path: dist/MedMask.app

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install ".[build]"

      - name: Test
        run: python -m pytest

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MedMask main.py

      - name: Build macOS
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --name MedMask --osx-bundle-identifier ru.medmask.local main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
